name: Nightly
on: workflow_dispatch

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    defaults:
      run:
        working-directory: src/github.com/Aziks0/containerd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/github.com/Aziks0/containerd
          persist-credentials: false

      - uses: ./src/github.com/Aziks0/containerd/.github/actions/install-go

      - name: Set env
        shell: bash
        run: |
          echo "GOPATH=${{ github.workspace }}" >> $GITHUB_ENV
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Build amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          make binaries

      - name: Upload artifacts (windows_amd64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows_amd64
          path: src/github.com/Aziks0/containerd/bin/
